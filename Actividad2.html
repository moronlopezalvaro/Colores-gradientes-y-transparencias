<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas Gradiantes</title>
    <link rel="stylesheet" href="style.css">    <!--enlazo el CSS para darle estilos a mi HTML-->
</head>
<body>
    <header>
        <h2>Gradiantes, Transparencias y Colores</h2>   <!--creo un header para el titulo de mi pagina-->
    </header>
    <main>
        <div id="rojo" class="cuadrado"> <!--creo una clase para que todos los cuadrados tengan la misma forma-->
            <p>Rojo</p>                  <!--creo tambien un id para cada cuadrado modificar sus colores-->
        </div>
   
        <div id="verde" class="cuadrado">
            <p>Verde</p>
        </div> 

        <div id="gradiante" class="cuadrado">
            <p>Gradiante</p>
        </div> 

        <div id="radial" class="cuadrado">
            <p>Radial</p>
        </div>

        <div id="triple" class="cuadrado">
            <p>Triple</p>
        </div>

        <div id="esquina" class="cuadrado">
            <p>Esquina</p>
        </div> 

        <div id="radial_triple" class="cuadrado">
            <p>Radial Triple</p>
        </div> 

        <div id="radial_esquina" class="cuadrado">
            <p>Radial Esquina</p>
        </div>
    </main>
</body>
</html>
